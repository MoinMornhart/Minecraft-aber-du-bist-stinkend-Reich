# Paper-Plugin „Minecraft, aber du bist stinkend reich“
name: StinkendReich
version: '${version}'
main: de.moinmornhart.stinkendreich.paper.StinkendReichPaper
api-version: '26.3'
description: Luxusvilla, Butler James, Bonzenautos und Handy – auf einem Paper-Server, ohne Mod beim Spieler.
author: MoinMornhart
website: https://github.com/MoinMornhart/Minecraft-aber-du-bist-stinkend-Reich
commands:
  villa:
    description: Villa (Platz, Rundgang, Nachbarvillen)
    permission: stinkendreich.villa
  butler:
    description: Butler James rufen und Aufträge geben
  handy:
    description: Das goldene Handy öffnen
permissions:
  stinkendreich.villa:
    description: Villa-Befehle für Betreiber
    default: op
